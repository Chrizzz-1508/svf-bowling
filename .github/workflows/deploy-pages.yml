name: Deploy static site to GitHub Pages

# Veroeffentlicht die statische Website aus dem Repository-Root auf GitHub Pages.
# Backend, Migrations und Quellcode werden nicht in das Pages-Artefakt kopiert.

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/**"
      - "admin/**"
      - "config.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare root static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -v *.html config.js _site/
          cp -R assets admin _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
